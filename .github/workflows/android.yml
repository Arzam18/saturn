name: Build Saturn for Android ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - '**.cpp'
      - '**.hpp'
      - 'CMakeLists.txt'
      - 'Makefile'
      - 'default.nnue'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - '**.cpp'
      - '**.hpp'
      - 'CMakeLists.txt'
      - 'Makefile'
      - 'default.nnue'
      - '.github/workflows/android.yml'

jobs:
  build:
    name: Android ARM64 with NEON
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools, ndk;27.2.12479018

      - name: Configure Android ARM64
        run: |
          mkdir -p build-android
          cp default.nnue build-android/
          cd build-android
          EVALFILE=default.nnue cmake .. \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Saturn
        run: cmake --build build-android --config Release --parallel

      - name: Stage Android binary
        run: |
          mkdir -p release
          cp build-android/saturn release/saturn-android-arm64

      - name: Upload Android ARM64 engine
        uses: actions/upload-artifact@v4
        with:
          name: saturn-android-arm64-neon
          path: release/saturn-android-arm64
          if-no-files-found: error
