name: Build Saturn for Android ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - '**.cpp'
      - '**.h'
      - '**.hpp'
      - '**.c'
      - '**.cmake'
      - 'CMakeLists.txt'
      - 'Makefile'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - '**.cpp'
      - '**.h'
      - '**.hpp'
      - '**.c'
      - '**.cmake'
      - 'CMakeLists.txt'
      - 'Makefile'
      - '.github/workflows/android.yml'

jobs:
  build:
    name: Android ARM64 NEON
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Set up Android NDK
        uses: android-actions/setup-ndk@v2
        with:
          ndk-version: 27.2.12479018

      - name: Configure Android ARM64
        run: |
          cmake -S . -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-march=armv8-a+simd" \
            -DCMAKE_CXX_FLAGS="-march=armv8-a+simd"

      - name: Build Saturn
        run: cmake --build build-android --config Release --parallel 2

      - name: Stage Android binary
        run: |
          mkdir -p release
          find build-android -type f -name "saturn" -exec cp {} release/saturn-arm64-android-neon \;

      - name: Verify binary
        run: |
          test -s release/saturn-arm64-android-neon
          file release/saturn-arm64-android-neon

      - name: Upload Android ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: saturn-android-arm64-neon
          path: release/saturn-arm64-android-neon
          if-no-files-found: error
